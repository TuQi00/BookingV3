<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="style.css">

    <title>Document</title>

</head>

<body>
    <div class="header">
        <p>
            Tu Quy Home Page
            <span>
                Backend Developer
            </span>
            &mdash; Thank you for visit! &mdash;
        </p>
    </div>

    <ul>
        <li>
            <a href="https://fontawesome.com/icons/house-chimney?f=classic&s=solid">
                <i class="fa-solid fa-house-chimney"style="color: #ffffff;"></i>
            </a>
        </li>
        <li>
            <a href="#">
                <i class="fa-solid fa-circle-plus" style="color: #ffffff;"></i>
            </a>
        </li>
        <li>
            <a href="#">
                <i class="fa-solid fa-circle-plus" style="color: #ffffff;"></i>
            </a>
        </li>
        <li>
            <a href="#"><i class="fa-solid fa-gear" style="color: #ffffff;"></i>
            </a>
        </li>
        <li>
            <a href="#"><i class="fa-solid fa-comment" style="color: #ffffff;"></i>
            </a>
        </li>
        <div class="marker"></div>
    </ul>

    <div class="calendar-container">
        <div class="calendar-header">
          <button class="nav-btn">&lt;</button>
          <select class="month-selector">
            <option>December</option>
            <option>January</option>
            <option>February</option>
            <!-- Add more months -->
          </select>
          <select class="year-selector">
            <option>2024</option>
            <option>2025</option>
            <!-- Add more years -->
          </select>
          <button class="nav-btn">&gt;</button>
        </div>
      
        <div class="calendar-grid">
          <div class="day-name">Mon</div>
          <div class="day-name">Tue</div>
          <div class="day-name">Wed</div>
          <div class="day-name">Thu</div>
          <div class="day-name">Fri</div>
          <div class="day-name">Sat</div>
          <div class="day-name">Sun</div>
      
          <!-- Generate date cells -->
          <div class="day disabled">25</div>
          <div class="day disabled">26</div>
          <div class="day disabled">27</div>
          <div class="day disabled">28</div>
          <div class="day disabled">29</div>
          <div class="day disabled">30</div>
          <div class="day disabled">1</div>
          <div class="day">2</div>
          <div class="day">3</div>
          <div class="day">4</div>
          <div class="day">5</div>
          <!-- Add more days -->
        </div>
      
        <button class="continue-btn">Continue</button>
      </div>
      

    <script src="./script.js"></script>
</body>

</html>
